services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amazon_db}
      POSTGRES_USER: ${POSTGRES_USER:-amazon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amazon_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amazon_user} -d ${POSTGRES_DB:-amazon_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - apparmor:unconfined
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    command: sh /app/docker/web-entrypoint.sh
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - apparmor:unconfined
  daemon:
    build:
      context: .
      dockerfile: docker/Dockerfile.daemon
    restart: unless-stopped
    command: sh /app/docker/daemon-entrypoint.sh
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - apparmor:unconfined
volumes:
  postgres_data:
