version: "2.4"

services:
  db:
    image: postgres:14
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - data-volume:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    security_opt:
      - apparmor:unconfined
  web-init:
    build: ./web-app
    command: /code/initserver.sh
    volumes:
      - ./web-app:/code
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - apparmor:unconfined
  web:
    build: ./web-app
    user: nobody
    command: /code/runserver.sh
    volumes:
      - ./web-app:/code
    expose:
      - "8000"
    depends_on:
      web-init:
        condition: service_completed_successfully
    security_opt:
      - apparmor:unconfined
  nginx:
    image: nginx:latest
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/config:/etc/nginx/conf.d
    depends_on:
      - web
    security_opt:
      - apparmor:unconfined
volumes:
   data-volume: